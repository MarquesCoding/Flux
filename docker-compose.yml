services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flux']
      interval: 10s
      timeout: 5s
      retries: 5

  flux:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://flux:flux@db:5432/flux
      PORT: '8420'
      TRUSTED_ORIGINS: http://localhost:8420
      COOKIE_SECURE: 'false'
    ports:
      - '8420:8420'
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - config:/config
      - cache:/cache
      - transcodes:/transcodes
      - ${FLUX_MEDIA_PATH:-./media}:/media:ro

volumes:
  db-data:
  config:
  cache:
  transcodes:
