name: Dev image

# Builds an image from any branch, by hand, so a change can be run somewhere real before it merges.
#
# Publish is off by default: most of the time the question is "does it build", and an image nobody
# asked for costs registry space and confuses anybody reading the tag list. Turn it on when you want
# to pull the thing onto a server or a television and actually watch something through it.
#
# Tags are named for where they came from, never `latest`, so a dev image can never be mistaken for a
# release or picked up by a deployment following the moving tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or sha to build
        required: false
        default: ''
      publish:
        description: Push it to the registry, rather than only proving it builds
        type: boolean
        required: false
        default: false
      platforms:
        description: Architectures to build
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        required: false
        default: linux/amd64

concurrency:
  group: dev-image-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build${{ inputs.publish && ' and publish' || '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Work out what to call it
        id: named
        run: |
          echo "image=ghcr.io/${OWNER,,}/valence" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "${REF}" | tr '/' '-' | tr -cd '[:alnum:]-_.' | cut -c1-40)" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ inputs.ref || github.ref_name }}

      - name: Work out how to tag it
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.named.outputs.image }}
          tags: |
            type=raw,value=dev-${{ steps.named.outputs.slug }}
            type=raw,value=dev-${{ steps.named.outputs.slug }}-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=Valence (dev)
            org.opencontainers.image.description=An unreleased build, for testing
            org.opencontainers.image.licenses=MIT

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ inputs.publish && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish && inputs.platforms == 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Say how to run it
        run: |
          {
            echo "### Dev image"
            echo
            if [ "${PUBLISHED}" = "true" ]; then
              echo "Pull and run it:"
              echo
              echo '```bash'
              echo "docker pull ${TAG}"
              echo "docker run --rm -p 8420:8420 ${TAG}"
              echo '```'
              echo
              echo "It needs a database and a media mount to do anything useful:"
              echo "see \`compose.yaml\` and point the \`valence\` service at this tag."
            else
              echo "Built, not published. Run this again with **publish** ticked to push it."
            fi
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PUBLISHED: ${{ inputs.publish }}
          TAGS: ${{ steps.meta.outputs.tags }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
