name: CI

# The gate every change goes through. Lint, types, the schema snapshot and the whole test suite, on
# every push and every pull request, so a branch that cannot merge says so before anybody reviews it.
#
# What is deliberately not here is the media pipeline. That job wants a Debian container, a Rust
# build and three minutes of encoding against the FFmpeg Valence ships, which is well over ten
# minutes of waiting — too slow to put in front of every push, and it lives in media-pipeline.yml to
# be run when it earns its keep: before a release, and after touching the transcoder.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # A hand-written migration with no snapshot beside it leaves generation silent and recreating
      # tables that already exist. See VAL-193.
      - run: pnpm db:check

      - run: pnpm test

  rust:
    name: Transcoder lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      # The transcoder's tests drive FFmpeg, and more of them than it looks. Thirty-four across six
      # suites synthesise their own input with lavfi and probe what comes back, so a runner without
      # FFmpeg fails them rather than skipping them.
      #
      # The runner's own build is enough. What these tests assert is the transcoder's behaviour
      # rather than the encoder's, and they pass against a stock FFmpeg as readily as against the
      # one Valence ships. That pinned build exists for tone mapping, and the job that needs it
      # generates the corpus against it in media-pipeline.yml.
      - name: FFmpeg, which the tests drive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # The corpus is deliberately not generated here. The suites that need one look for it and skip
      # when it is absent, and building it is the three minutes that belongs in media-pipeline.yml.
      - run: cargo test
