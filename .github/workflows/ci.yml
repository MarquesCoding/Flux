name: CI

# Run by hand, from the Actions tab, and never on its own.
#
# This is a private repository, so every minute a runner spends is billed, and this workflow is not
# cheap: a Debian container, a Rust build, and three minutes of encoding to generate the corpus. Run
# automatically on every push it would cost real money to tell us what the pre-push hook already
# said locally for nothing.
#
# The hooks stay the everyday gate. This is the deeper check — the whole corpus, against the FFmpeg
# Flux ships — for when it is worth asking: before a release, after touching the media pipeline, or
# when a rule's behaviour is in question.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build Flux ships, rather than whatever the runner happens to carry. ADR-0009 pins it so a
  # transcode behaves the same everywhere, and a fixture generated against a different FFmpeg is a
  # different fixture.
  FLUX_FFMPEG_VERSION: 8.1.2-2flux1
  FLUX_FFMPEG_SUITE: bookworm
  FLUX_FFMPEG: /usr/lib/flux-ffmpeg/ffmpeg
  FLUX_FFPROBE: /usr/lib/flux-ffmpeg/ffprobe

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  transcoder:
    name: Media pipeline
    runs-on: ubuntu-latest
    # In Debian rather than on the runner's Ubuntu, because the FFmpeg Flux ships is built for
    # Debian and its packages say so: the bookworm build wants libvpx7 and the trixie one wants
    # libwebp 1.5 and libx265-215, none of which Ubuntu noble carries. Bookworm is what the runtime
    # image is built on, so the corpus is generated by the same FFmpeg on the same libraries the
    # product uses, which is the only version of this job worth having.
    container:
      image: debian:bookworm-slim
    steps:
      # Nothing is in a slim image, including what checkout needs to clone with.
      - name: Everything the image does not carry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential pkg-config

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install the FFmpeg Flux ships
        run: |
          curl -fsSL -o /tmp/flux-ffmpeg.deb \
            "https://github.com/MarquesCoding/flux-ffmpeg/releases/download/v${FLUX_FFMPEG_VERSION}/flux-ffmpeg_${FLUX_FFMPEG_VERSION}-${FLUX_FFMPEG_SUITE}_amd64.deb"
          apt-get install -y --no-install-recommends /tmp/flux-ffmpeg.deb
          "$FLUX_FFMPEG" -version | head -1
          "$FLUX_FFMPEG" -hide_banner -filters | grep -E "zscale|libplacebo" || (echo "the shipped build lost its tone mapping filters" && exit 1)

      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      # Keyed on what decides the bytes: the matrix, how it is built, and the FFmpeg building it.
      # A cache hit skips three minutes of encoding; a miss regenerates rather than failing, because
      # a generated fixture is reproducible from its inputs and never downloaded.
      - name: Cache the generated corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/flux-fixtures
          key: >-
            fixtures-${{ env.FLUX_FFMPEG_VERSION }}-${{ hashFiles('tools/fixtures/fixtureMatrix.ts',
            'tools/fixtures/fixtureArguments.ts', 'tools/fixtures/fetchedFixtures.ts',
            'tools/fixtures/derivedFixtures.ts') }}

      - name: Build the corpus
        run: pnpm fixtures:sync --tier 1

      # Asserts every fixture is what the matrix claims, which is what makes the corpus worth
      # testing against. A corpus that lies is worse than none.
      - name: Check the corpus describes itself honestly
        run: pnpm --filter @flux/tools exec vitest run fixtures/

      - name: Test the media pipeline against it
        run: cargo test

      # The one thing this job knows that a laptop cannot: what the corpus comes out as on amd64,
      # against the build the product ships. Kept so the two can be compared without paying for
      # another run — a generated fixture is reproducible from its inputs, so a checksum that moves
      # between architectures is worth being able to see rather than guess at.
      - name: Keep what this architecture produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures-manifest-amd64
          path: fixtures.manifest.json
          if-no-files-found: warn
