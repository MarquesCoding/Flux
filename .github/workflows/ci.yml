name: CI

# The gate every change goes through. Lint, types, the schema snapshot and the whole test suite, on
# every push and every pull request, so a branch that cannot merge says so before anybody reviews it.
#
# What is deliberately not here is the media pipeline. That job wants a Debian container, a Rust
# build and three minutes of encoding against the FFmpeg Valence ships, which is well over ten
# minutes of waiting — too slow to put in front of every push, and it lives in media-pipeline.yml to
# be run when it earns its keep: before a release, and after touching the transcoder.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # A hand-written migration with no snapshot beside it leaves generation silent and recreating
      # tables that already exist. See VAL-193.
      - run: pnpm db:check

      - run: pnpm test

  rust:
    name: Transcoder lint and tests
    runs-on: ubuntu-latest
    # Not on pull requests. A Debian container, a cold Rust build and a decode against the shipped
    # FFmpeg is minutes of waiting, and paying it on every push to every branch buys less than it
    # costs: the pre-push hook has already run cargo clippy and cargo test on the machine the change
    # was written on.
    #
    # So it runs where being slow is affordable and being wrong is expensive: on the merge to main,
    # in the gate a release must pass, and once a week against the corpus in media-pipeline.yml. The
    # trade is that a transcoder break is caught just after a merge rather than just before one.
    if: github.event_name != 'pull_request'
    # In Debian, against the FFmpeg Valence ships, because these tests decode rather than merely
    # calling something that does. One of them scribbles over the middle of a clip and requires the
    # decoder to notice; Ubuntu's 6.1.1 decodes the damage without complaint and the test fails,
    # which says nothing about Valence and everything about which FFmpeg was asked. Testing the
    # transcoder against a build that ships to nobody answers a question nobody has.
    #
    # The shipped build is packaged for Debian and wants libraries Ubuntu noble does not carry, so
    # the container is what makes running the real thing possible at all.
    container:
      image: debian:bookworm-slim
    env:
      VALENCE_FFMPEG_VERSION: 8.1.2-2flux2
      VALENCE_FFMPEG_SUITE: bookworm
      VALENCE_FFMPEG: /usr/lib/flux-ffmpeg/ffmpeg
      VALENCE_FFPROBE: /usr/lib/flux-ffmpeg/ffprobe
    steps:
      # Nothing is in a slim image, including what checkout needs to clone with. The corpus tools
      # are deliberately absent: cargo test shells out to FFmpeg and nothing else.
      - name: Everything the image does not carry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential pkg-config

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Before FFmpeg is fetched, so a formatting slip is not made to wait on a download.
      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - name: Install the FFmpeg Valence ships
        run: |
          curl -fsSL -o /tmp/flux-ffmpeg.deb \
            "https://github.com/MarquesCoding/flux-ffmpeg/releases/download/v${VALENCE_FFMPEG_VERSION}/flux-ffmpeg_${VALENCE_FFMPEG_VERSION}-${VALENCE_FFMPEG_SUITE}_amd64.deb"
          apt-get install -y --no-install-recommends /tmp/flux-ffmpeg.deb
          "$VALENCE_FFMPEG" -version | head -1
          # On the path as well as in the variables. The package installs beside the system's own
          # FFmpeg rather than as it, and a slim image has none, so a test reaching for the bare
          # name finds nothing.
          ln -sf "$VALENCE_FFMPEG" /usr/local/bin/ffmpeg
          ln -sf "$VALENCE_FFPROBE" /usr/local/bin/ffprobe

      # The corpus is deliberately not generated here. The suites that need one look for it and skip
      # when it is absent, and building it is the three minutes that belongs in media-pipeline.yml.
      - run: cargo test
