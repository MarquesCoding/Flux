name: Media pipeline

# The deeper check, run deliberately rather than on every push.
#
# It builds the whole fixture corpus and tests the transcoder against the FFmpeg Valence ships,
# rather than whatever the developer's machine happens to have. That difference is not academic: a
# preview argument one build accepts and another rejects took down every VideoToolbox render, caught
# only by the single test here that starts a real FFmpeg.
#
# It is out of ci.yml because a Debian container, a Rust build and three minutes of encoding is well
# over ten minutes of waiting, and holding every pull request behind that buys less than it costs.
# Run it before a release, after touching the media pipeline, or when a rule's behaviour is in
# question.

on:
  workflow_dispatch:
  schedule:
    # Once a week, so a break in the shipped FFmpeg is found by a schedule rather than by a release.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build Valence ships, rather than whatever the runner happens to carry. The version is pinned
  # so a transcode behaves the same everywhere, and a fixture generated against a different FFmpeg is
  # a different fixture.
  VALENCE_FFMPEG_VERSION: 8.1.2-2flux2
  VALENCE_FFMPEG_SUITE: bookworm
  VALENCE_FFMPEG: /usr/lib/flux-ffmpeg/ffmpeg
  VALENCE_FFPROBE: /usr/lib/flux-ffmpeg/ffprobe
  # Named rather than left to `~`, which the cache action expands on the runner and Node expands
  # inside the container. In a container job those are not the same directory, and a cache that
  # saves one while the corpus is written to the other silently caches nothing.
  VALENCE_FIXTURES_DIR: /tmp/valence-fixtures

jobs:
  transcoder:
    name: The corpus, and the transcoder against it
    runs-on: ubuntu-latest
    # In Debian rather than on the runner's Ubuntu, because the FFmpeg Valence ships is built for
    # Debian and its packages say so: the bookworm build wants libvpx7 and the trixie one wants
    # libwebp 1.5 and libx265-215, none of which Ubuntu noble carries. Bookworm is what the runtime
    # image is built on, so the corpus is generated by the same FFmpeg on the same libraries the
    # product uses, which is the only version of this job worth having.
    container:
      image: debian:bookworm-slim
    steps:
      # Nothing is in a slim image, including what checkout needs to clone with.
      - name: Everything the image does not carry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential pkg-config \
            unzip mkvtoolnix

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install the FFmpeg Valence ships
        run: |
          curl -fsSL -o /tmp/flux-ffmpeg.deb \
            "https://github.com/MarquesCoding/flux-ffmpeg/releases/download/v${VALENCE_FFMPEG_VERSION}/flux-ffmpeg_${VALENCE_FFMPEG_VERSION}-${VALENCE_FFMPEG_SUITE}_amd64.deb"
          apt-get install -y --no-install-recommends /tmp/flux-ffmpeg.deb
          "$VALENCE_FFMPEG" -version | head -1
          "$VALENCE_FFMPEG" -hide_banner -filters | grep -E "zscale|libplacebo" || (echo "the shipped build lost its tone mapping filters" && exit 1)
          # On the path as well as in the variables. The package installs beside the system's own
          # ffmpeg rather than as it, and a slim image has no system ffmpeg at all, so anything that
          # reaches for the name rather than the variable finds nothing.
          ln -sf "$VALENCE_FFMPEG" /usr/local/bin/ffmpeg
          ln -sf "$VALENCE_FFPROBE" /usr/local/bin/ffprobe

      - run: pnpm install --frozen-lockfile

      # Keyed on what decides the bytes: the matrix, how it is built, and the FFmpeg building it.
      # A cache hit skips three minutes of encoding; a miss regenerates rather than failing, because
      # a generated fixture is reproducible from its inputs and never downloaded.
      - name: Cache the generated corpus
        uses: actions/cache@v4
        with:
          path: /tmp/valence-fixtures
          key: >-
            fixtures-${{ env.VALENCE_FFMPEG_VERSION }}-${{ hashFiles('tools/fixtures/fixtureMatrix.ts',
            'tools/fixtures/fixtureArguments.ts', 'tools/fixtures/fetchedFixtures.ts',
            'tools/fixtures/derivedFixtures.ts', 'tools/fixtures/synthesisedFixtures.ts',
            'tools/fixtures/synthesisedMetadata.ts') }}

      # Tier two as well, which is the Dolby Vision and HDR10+ pair. Neither can be authored by
      # FFmpeg, so they are written by two MIT tools the sync fetches and muxed by mkvmerge, whose
      # Matroska keeps a Dolby Vision RPU where FFmpeg's own muxers lose it.
      - name: Build the corpus
        run: pnpm fixtures:sync --tier 2

      # Asserts every fixture is what the matrix claims, which is what makes the corpus worth
      # testing against. A corpus that lies is worse than none.
      - name: Check the corpus describes itself honestly
        run: pnpm --filter @valence/tools exec vitest run fixtures/

      - name: Test the media pipeline against it
        run: cargo test

      # The one thing this job knows that a laptop cannot: what the corpus comes out as on amd64,
      # against the build the product ships. Kept so the two can be compared without paying for
      # another run.
      - name: Keep what this architecture produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixtures-manifest-amd64
          path: fixtures.manifest.json
          if-no-files-found: warn
