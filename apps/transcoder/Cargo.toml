[package]
name = "valence-transcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
sha2 = "0.11"
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "net", "signal", "sync"] }
sysinfo = "0.39.0"
async-stream = "0.3.6"
rustfft = "6.4.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "valence_transcoder"
path = "src/lib.rs"

[[bin]]
name = "valence-transcoder"
path = "src/main.rs"
